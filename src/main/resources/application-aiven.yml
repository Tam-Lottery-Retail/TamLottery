spring:
  config:
    activate:
      on-profile: aiven
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: 5000

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN
